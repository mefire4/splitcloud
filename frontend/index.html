<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SplitCloud</title>
<style>
  :root {
    --bg: #F6F5F2;
    --card: #FFFFFF;
    --ink: #1E2422;
    --muted: #6B7570;
    --accent: #2F6E5C;
    --accent-light: #E4EFEA;
    --border: #E1DFD8;
    --danger: #B4483A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 40px 20px 80px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 16px;
  }

  .card h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 24px 0 12px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
  }

  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    background: var(--card);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  button:hover {
    opacity: 0.9;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background: var(--accent-light);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  p[id$="-status"] {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 0;
  }

  #app-section { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <h1>SplitCloud</h1>
  <p class="subtitle">Gestion de dépenses partagées — projet serverless AWS</p>

  <div id="login-section" class="card">
    <h2>Connexion</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="seConnecter()">Se connecter</button>
    <p id="login-status"></p>
  </div>

  <div id="app-section">

    <div class="card">
      <h2>Créer un groupe</h2>
      <input type="text" id="nouveau-groupe-nom" placeholder="Nom du groupe">
      <input type="text" id="nouveau-groupe-membres" placeholder="Membres séparés par des virgules (ex: Marie,Tom,Léa)">
      <button onclick="creerGroupe()">Créer le groupe</button>
      <p id="creer-groupe-status"></p>
    </div>

    <div class="card">
      <h2>Dépenses du groupe</h2>
      <input type="text" id="groupe-id" placeholder="ID du groupe">
      <button onclick="chargerDepenses()">Charger les dépenses</button>
      <ul id="liste-depenses"></ul>

      <h3>Ajouter une dépense</h3>
      <input type="text" id="depense-payeur" placeholder="Qui a payé ?">
      <input type="number" id="depense-montant" placeholder="Montant (€)">
      <input type="text" id="depense-description" placeholder="Description">
      <button onclick="ajouterDepense()">Ajouter la dépense</button>
      <p id="ajouter-depense-status"></p>

      <h3>Calcul des soldes</h3>
      <button onclick="calculerSoldes()">Calculer qui doit combien</button>
      <ul id="liste-soldes"></ul>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
